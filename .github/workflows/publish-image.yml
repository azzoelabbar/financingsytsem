name: Publish Docker image

# Builds ميزان into a public image so anyone can run it with a single
# `docker run`, with no copy of this repository.
#
# Pushes to the GitHub Container Registry using the token GitHub provides —
# there is nothing to configure and no secret to add.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Lets the amd64 runner produce the arm64 image too (Apple Silicon,
      # Raspberry Pi, ARM servers).
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Registry paths must be lowercase; the owner name may not be.
      - id: name
        run: echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/mizan" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - run: |
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo 'docker run -d --name mizan -p 8080:8080 \' >> "$GITHUB_STEP_SUMMARY"
          echo '  -v mizan-data:/data -v mizan-storage:/app/storage \' >> "$GITHUB_STEP_SUMMARY"
          echo '  --restart unless-stopped ${{ steps.name.outputs.image }}:latest' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
