name: Publish Docker image

# Builds ميزان into a public image so anyone can run it with a single
# `docker run`, with no copy of this repository.
#
# Pushes to the GitHub Container Registry using the token GitHub provides —
# there is nothing to configure and no secret to add.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      all_platforms:
        description: 'Also build the arm64 image (slow — Apple Silicon, ARM servers)'
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      # arm64 is emulated on an amd64 runner, which is slow and eats the
      # Actions minutes a private repository is billed for. So: amd64 on every
      # push, and arm64 (Apple Silicon, ARM servers) only for a release tag or
      # when asked for by hand.
      - id: platforms
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/') || inputs.all_platforms }}" = "true" ]; then
            echo "list=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
          else
            echo "list=linux/amd64" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v4
        if: contains(steps.platforms.outputs.list, 'arm64')
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Registry paths must be lowercase; the owner name may not be.
      - id: name
        run: echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/mizan" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ steps.platforms.outputs.list }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - run: |
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo 'docker run -d --name mizan -p 8080:8080 \' >> "$GITHUB_STEP_SUMMARY"
          echo '  -v mizan-data:/data -v mizan-storage:/app/storage \' >> "$GITHUB_STEP_SUMMARY"
          echo '  --restart unless-stopped ${{ steps.name.outputs.image }}:latest' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
